# Temporary workflow to validate the Jekyll build of the personal site
name: Validate Jekyll build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated site
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          echo "--- Generated publication pages ---"
          ls _site/publication/
          echo "--- Homepage content checks ---"
          grep -c "Junteng Liu" _site/index.html
          grep -c "SynLogic" _site/index.html
          grep -c "Composing Parameter-Efficient Modules" _site/index.html
          grep -c "LJT-Homepage/publication/2025-01-01-synlogic" _site/index.html
          echo "--- Publications page content checks ---"
          grep -c "SynLogic" _site/publications/index.html
          grep -c "C-Eval" _site/publications/index.html
          echo "--- CV page content checks ---"
          grep -c "Zhiyuan Honor Scholarship" _site/cv/index.html
